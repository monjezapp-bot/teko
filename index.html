<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ToGo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#eef3f6;--ink:#0d2438;--mut:#5d7183;--brand:#00a389;--line:#dbe4ea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:"IBM Plex Sans Arabic",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
#mw{flex:1;min-height:220px;position:relative}
#map{position:absolute;inset:0;isolation:isolate}
#panel{flex:0 0 auto;max-height:54vh;display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:#fff;margin-top:-22px;border-radius:24px 24px 0 0;position:relative;z-index:500;box-shadow:0 -8px 28px rgba(13,36,56,.14)}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:0 14px;min-height:48px;background:var(--brand);color:#fff}
button.g{background:var(--bg);color:var(--ink);font-weight:600}
button.ok{background:var(--brand)}
.row{display:flex;gap:8px;margin:10px 0}.row>*{flex:1}
#next{background:var(--ink);color:#fff;border-radius:20px;padding:16px}
#next h2{margin:0 0 8px;font-size:20px;font-weight:800}
#next p{margin:4px 0;color:#c9d6e0;line-height:1.6}
#next b{color:#fff}
#next a{color:#7ff0d8;font-weight:800;font-size:18px;text-decoration:none}
#next .row{margin:12px 0 0}
#next button.g{background:rgba(255,255,255,.14);color:#fff}
#list p{color:var(--mut);margin:12px 4px 0}
.item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--bg);color:var(--ink);display:grid;place-items:center;font-weight:800;font-size:14px}
.item div{flex:1;min-width:0}.item small{display:block;color:var(--mut)}
.item button{min-height:38px;font-size:13px}
dialog{width:92%;max-width:420px;border:0;border-radius:22px;padding:18px}
dialog input,dialog textarea,#auth input{width:100%;font:inherit;font-size:16px;padding:12px 14px;margin:5px 0;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
dialog input:focus,dialog textarea:focus,#auth input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,163,137,.18)}
#auth h1{margin:0 0 6px;font-size:40px;font-weight:800}
#auth h1 i{font-style:normal;background:var(--brand);color:#fff;border-radius:12px;padding:0 10px}
#auth{background:#fff!important}
#msg{color:#c0392b;font-size:14px;min-height:20px}
.pin{background:#2b8a3e;color:#fff;border-radius:9px;min-width:30px;height:30px;padding:0 6px;display:grid;place-items:center;font-weight:800;font-size:15px;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.pin.first{background:#12a150;min-width:38px;height:38px;font-size:18px}
.arrow{width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);display:grid;place-items:center;color:#2f7df6;font-size:22px}
#turn{position:fixed;z-index:800;top:calc(10px + env(safe-area-inset-top));inset-inline:10px;background:#062a3a;color:#fff;border-radius:18px;padding:12px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#turn[hidden]{display:none}
#turn .ic{font-size:44px;line-height:1;flex:none}
#turn .tx{flex:1;min-width:0}
#turn .dd{font-size:22px;font-weight:800}
#turn .st{font-size:20px;color:#c9d6e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab{position:absolute;z-index:800;inset-inline-start:12px;bottom:36px;width:50px;min-height:50px;height:50px;border-radius:50%;background:#fff;color:var(--ink);box-shadow:0 3px 12px rgba(0,0,0,.3);font-size:22px;padding:0}
#bar{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px}
#bar b{font-size:26px;font-weight:800}
#bar span{color:var(--mut)}
#mid{flex:1;min-height:0;overflow:auto}
.fab.on{background:#2f7df6;color:#fff}
#acts{padding-top:10px}
#acts .row{margin:0;gap:6px}
#acts button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;padding:0 4px;font-size:13px;white-space:nowrap}
#acts button i{font-style:normal;font-size:20px;line-height:1}
#acts .pri{background:var(--brand);color:#fff;flex:1.3}
#panel::before{content:"";flex:none;width:42px;height:4px;border-radius:4px;background:#d5dde4;margin:-6px auto 12px}
#panel.min #list,#panel.min #bar{display:none}
#next{background:linear-gradient(135deg,#0b1f33 0%,#0a4d57 100%);box-shadow:0 8px 22px rgba(11,31,51,.25)}
.nh{display:flex;align-items:center;gap:12px}
.nb{flex:none;width:46px;height:46px;border-radius:14px;background:#12a150;display:grid;place-items:center;font-size:22px;font-weight:700}
.nt{flex:1;min-width:0}
.nt h2{margin:0;font-size:19px}
.nt .ad{margin:2px 0 0;font-size:13px;color:#b9cbd8}
.call{flex:none;width:48px;height:48px;border-radius:50%;background:#12a150;display:grid;place-items:center;font-size:21px;text-decoration:none;box-shadow:0 4px 12px rgba(18,161,80,.45)}
.ord{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.1);font-size:14px;color:#e6eef4}
.sw{position:relative;margin-top:14px;height:56px;border-radius:28px;background:rgba(255,255,255,.12);overflow:hidden;display:flex;align-items:center;justify-content:center}
.sw .tx{font-size:15px;font-weight:600;color:#dbe7ef;pointer-events:none}
.th{position:absolute;inset-inline-start:4px;top:4px;width:48px;height:48px;border-radius:50%;background:#12a150;display:grid;place-items:center;font-size:22px;touch-action:none;cursor:grab}
.dl{background:none;color:#9fb3c4;min-height:36px;font-weight:500;font-size:13px;width:100%;margin-top:6px}
.item{background:#f6f9fb;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px}
.n{background:#12a150;color:#fff}
#bar em{margin-inline-start:auto;font-style:normal;background:var(--bg);border-radius:99px;padding:3px 12px;font-size:13px;font-weight:600}
#turn{background:linear-gradient(135deg,#062a3a,#0b4a52);backdrop-filter:blur(8px)}
#turn .ic{width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:36px}
dialog{margin:auto auto 0;width:100%;max-width:none;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
dialog::backdrop{background:rgba(8,24,38,.5)}
#auth{background:linear-gradient(160deg,#0b1f33,#0a4d57)!important;color:#fff}
#auth p{color:#9fb3c4!important}
#cf h2{margin:0 0 6px;font-size:20px}
#cf p{margin:0 0 14px;color:var(--mut);line-height:1.7}
#cf .row{margin:0}
#cfy.danger{background:#d93025}
#toast{position:fixed;z-index:950;inset-inline:12px;top:calc(96px + env(safe-area-inset-top));background:#0d2438;color:#fff;border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
#toast[hidden]{display:none}
#toast .ub{background:#12a150;min-height:38px;padding:0 16px;margin-inline-start:auto}
#shift{border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;background:#f6f9fb}
#shift input{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff}
#shift button{width:100%}
#shift .row{margin:0}
.sr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
.sr span{color:var(--mut);font-weight:500}
.hint{margin:8px 0 0;font-size:12px;color:var(--mut)}
#bk h2{margin:0 0 10px;font-size:20px}
#bk .row{margin:8px 0}
#next h2{font-size:26px;line-height:1.25}
.nb{width:50px;height:50px;font-size:24px}
.nt .ad{font-size:17px;color:#d4e2ec;margin-top:4px}
.chs{display:flex;gap:10px;margin-top:12px}
.ch{flex:1;background:rgba(255,255,255,.12);border-radius:16px;padding:8px 10px;text-align:center}
.ch small{display:block;font-size:13px;color:#b9cbd8}
.ch b{font-size:34px;line-height:1.1;font-weight:700}
.ord{margin-top:12px;font-size:19px}
.ord small{display:block;font-size:12px;color:#b9cbd8;margin-bottom:2px}
.ca{display:flex;gap:10px;margin-top:12px}
.cb{flex:1;height:62px;border-radius:16px;display:grid;place-items:center;font-size:20px;font-weight:700;text-decoration:none;color:#fff}
.c1{background:#12a150;flex:1.4}.c2{background:#25d366}
.bigdone{width:100%;height:64px;margin-top:12px;font-size:21px;border-radius:16px;background:#fff;color:#0b1f33}
#cfp{white-space:pre-line}
#rc h2{margin:0 0 6px;font-size:21px}
#rc p{margin:0 0 12px;color:var(--mut);line-height:1.7}
#rc button{width:100%;min-height:58px;margin-top:8px;font-size:17px}
.rcpt{margin:0 0 8px;padding:8px 12px;border-radius:12px;background:#e7f3f1;color:#0a7d6e;font-weight:600;font-size:14px}
.rcpt.warn{background:#fff3e0;color:#b35a00}
dialog{max-height:92vh;overflow:auto}
.pb{display:grid;place-items:center;height:64px;border-radius:16px;background:var(--ink);color:#fff;font-weight:700;font-size:18px;margin:4px 0 8px}
#ocr{font-size:13px;color:var(--mut);min-height:18px;margin-bottom:6px}
.seg{display:flex;gap:6px}.seg button{flex:1;min-height:48px;padding:0 6px;font-size:14px;white-space:nowrap}
.seg button.on{background:var(--brand);color:#fff}
.pay{margin-top:12px;padding:12px;border-radius:14px;font-size:22px;font-weight:700;text-align:center}
.pay.cash{background:#ffd43b;color:#3d2c00}.pay.paid{background:rgba(255,255,255,.14);color:#9ff0dd;font-size:17px}
.invn{font-size:13px;color:#b9cbd8;margin-top:2px}
.wl{display:flex;gap:6px;align-items:center}
.wl button{min-height:42px;font-size:13px;padding:0 10px;white-space:nowrap}
/* palette: blue, green, beige, yellow, burnt orange */
:root{--brand:#c2410c;--blue:#1f5fbf;--green:#12a150;--beige:#f5ecd6;--yellow:#f5c518;--ink:#0f2238;--bg:#efe6d0;--line:#dccfae}
#panel{background:var(--beige)}
body.night{--bg:#14161a;--line:#2b3442;--mut:#9aa7b8}
body.night #panel,body.night #trip{background:#1c1d21;color:#fff}
body.night .maplibregl-canvas{filter:invert(.92) hue-rotate(180deg) saturate(.75) brightness(.92)}
body.working #panel{display:none}
body.working.menu #panel{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:900;max-height:82vh}
#pclose{display:none;margin-bottom:10px}
body.menu #pclose{display:block}
body.working .fab{position:fixed;bottom:calc(var(--th,140px) + 16px)!important}
body.working #loc{bottom:calc(var(--th,140px) + 80px)!important}
#trip{position:fixed;inset-inline:0;bottom:0;z-index:700;background:var(--beige);color:var(--ink);border-radius:28px 28px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(15,34,56,.25);max-height:80vh;overflow:auto}
#trip[hidden],#arr[hidden]{display:none}
.gp{width:44px;height:4px;border-radius:4px;background:#b9ad92;margin:0 auto 8px;touch-action:none}
.th{display:flex;align-items:center}
.th .te{flex:1;text-align:center}.te b{display:block;font-size:26px;font-weight:700}.te small{font-size:15px;color:var(--mut)}.te small i{font-style:normal;color:var(--brand);font-weight:700}
.th button{width:46px;min-height:46px;height:46px;padding:0;border-radius:50%;background:transparent;color:inherit;font-size:24px}
#trip .tc,#trip .td{display:none}
#trip.l1 .tc,#trip.l2 .tc{display:flex}#trip.l2 .td{display:block}
#trip.l0 .sw2{display:none}
.tc,.ar-h{align-items:center;gap:12px;padding:12px 4px;border-top:1px solid rgba(128,128,128,.25)}
.ar-h{display:flex;border:0}
.tc .nm,.ar-h .nm{flex:1}.nm b{font-size:24px;display:block}.nm small{color:var(--mut)}
.tc a,.callr{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:24px;text-decoration:none}
.td .box{background:rgba(15,34,56,.07);border-radius:20px;padding:14px;margin-bottom:10px}
body.night .td .box{background:#2a2b30}
.td small{color:var(--mut);display:block;margin-top:8px}.td .ad2{font-size:18px;font-weight:600}
.td .ch{background:rgba(15,34,56,.08);color:inherit}.td .ch small{color:var(--mut)}
.pay.paid2{background:var(--green);color:#fff;font-size:18px}
.sw2{position:relative;height:76px;border-radius:38px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:700;margin-top:8px;overflow:hidden}
.sw2 .hd{position:absolute;inset-inline-start:6px;top:6px;width:64px;height:64px;border-radius:50%;background:#fff;color:var(--green);display:grid;place-items:center;font-size:28px;font-weight:800;touch-action:none}
#arr{position:fixed;inset:0;z-index:1000;background:var(--beige);color:var(--ink);overflow:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
body.night #arr{background:#1b1b1d;color:#fff}
.stp{font-size:13px;color:var(--mut);margin-bottom:12px}
.paycard{border-radius:28px;padding:22px;color:#fff;background:linear-gradient(135deg,#1f5fbf,#174a96);margin:12px 0}
.paycard.pp{background:linear-gradient(135deg,#0f5132,#12a150)}
.paycard .big{font-size:52px;font-weight:700;line-height:1.2}
.q{font-size:21px;font-weight:700;margin:20px 0 12px}
#arr .bt{width:100%;min-height:64px;font-size:19px;border-radius:18px;margin-top:10px}
.bt.gr{background:var(--green)}.bt.out{background:transparent;border:2px solid #b9ad92;color:inherit}
.ck{display:flex;gap:12px;align-items:center;background:rgba(15,34,56,.07);border-radius:16px;padding:14px;margin-top:14px;font-size:16px}
.ck input{width:26px;height:26px}
</style>
</head>
<body>
<div id="turn" hidden></div>
<div id="toast" hidden></div>
<div id="trip" class="l0" hidden>
  <div class="gp" id="tg"></div>
  <div class="th"><button id="tm" aria-label="خيارات">☰</button><div class="te"><b id="tEta">—</b><small id="tArr"></small></div><button id="tx" aria-label="توسيع">⌃</button></div>
  <div class="tc" id="tCust"></div>
  <div class="td" id="tDet"></div>
  <div class="sw2" id="tSw"><span>وصلت إلى موقع العميل</span><div class="hd" id="tHd">«</div></div>
</div>
<div id="arr" hidden></div>
<div id="mw">
  <div id="map"></div>
  <button class="fab" id="nav">🧭</button>
  <button class="fab" id="loc" style="bottom:96px;color:#2f7df6;font-size:28px">◎</button>
</div>
<div id="panel">
  <div id="mid">
    <button class="g" id="pclose">رجوع إلى الرحلة</button>
    <div id="shift"></div>
    <div id="bar"></div>
    <div id="next"></div>
    <div id="list"></div>
  </div>
  <div id="acts">
    <div class="row">
      <button class="g" id="opt"><i>🔀</i>رتّب</button>
      <button class="pri" id="add"><i>＋</i>أوردر جديد</button>
      
      <button class="g" id="out"><i>⎋</i>خروج</button>
    </div>
  </div>
</div>

<dialog id="bk">
  <h2>مدة الاستراحة</h2>
  <div class="row"><button class="g" data-m="15">15 دقيقة</button><button class="g" data-m="30">30 دقيقة</button></div>
  <div class="row"><button class="g" data-m="45">45 دقيقة</button><button class="g" data-m="60">60 دقيقة</button></div>
  <button class="g" id="bkc" style="width:100%">إلغاء</button>
</dialog>

<dialog id="rc">
  <h2>🧾 الفاتورة</h2>
  <p>هل استلمت الفاتورة (الريسيت) من العميل ومعاك دلوقتي؟ لازم ترجعها للشركة.</p>
  <button id="rcy">✅ أيوه، الفاتورة معايا</button>
  <button class="g" id="rcn">❌ لا، مش معايا</button>
  <button class="g" id="rcb">رجوع</button>
</dialog>

<dialog id="cf">
  <h2 id="cft"></h2><p id="cfp"></p>
  <div class="row"><button class="g" id="cfn">إلغاء</button><button id="cfy">تأكيد</button></div>
</dialog>

<dialog id="dlg">
  <h2 style="margin:0 0 6px">أوردر جديد</h2>
  <label class="pb" for="ph">📷 صوّر الفاتورة</label>
  <input type="file" id="ph" accept="image/*" capture="environment" hidden>
  <div id="ocr">أو اكتب البيانات بإيدك</div>
  <input id="name" placeholder="اسم العميل">
  <input id="phone" placeholder="رقم التليفون" inputmode="tel">
  <input id="addr" placeholder="العنوان">
  <div class="row"><input id="bld" placeholder="عمارة"><input id="apt" placeholder="شقة"></div>
  <input id="ord" placeholder="المنتجات">
  <div class="row"><input id="inv" placeholder="رقم الفاتورة"><input id="trk" placeholder="رقم التتبع"></div>
  <div class="row"><input id="amt" placeholder="المبلغ" inputmode="decimal"><div class="seg"><button class="g on" id="pcash" type="button">💵 كاش</button><button class="g" id="ppaid" type="button">✔ مدفوع</button></div></div>
  <textarea id="link" rows="2" placeholder="لينك الموقع (اختياري، ممكن تضيفه بعدين)"></textarea>
  <div id="msg"></div>
  <div class="row"><button id="save">حفظ الأوردر</button><button class="g" id="cancel">إلغاء</button></div>
</dialog>

<div id="auth" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:9999;padding:24px;flex-direction:column;gap:8px;justify-content:center">
  <h1>To<i>Go</i></h1><p style="color:#5d7183;margin:0 0 10px">سجّل دخولك عشان تبدأ مسارك.</p>
  <p style="margin:0 0 6px;font-size:13px">🔒 اتصال مشفّر وآمن</p>
  <input id="em" type="email" placeholder="الإيميل">
  <input id="pw" type="password" placeholder="كلمة السر">
  <input id="nm" placeholder="الاسم (للحساب الجديد بس)">
  <div class="row"><button id="in">دخول</button><button class="g" id="up">حساب جديد</button></div>
  <div id="amsg" style="color:#b3261e"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script type="module">
import {createClient} from 'https://esm.sh/@neondatabase/neon-js';
const COMPANY='Marmelade Designs';
const db=createClient({
  auth:{url:'https://ep-noisy-feather-b72o2ma5.neonauth.c-13.us-east-1.aws.neon.tech/neondb/auth'},
  dataApi:{url:'https://ep-noisy-feather-b72o2ma5.apirest.c-13.us-east-1.aws.neon.tech/neondb/rest/v1'}
});
let S=[], order=[], me=null, geo=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

maplibregl.setRTLTextPlugin('https://cdn.jsdelivr.net/npm/@mapbox/mapbox-gl-rtl-text@0.3.0/dist/mapbox-gl-rtl-text.js',true);
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:[31.24,30.05],zoom:11,attributionControl:{compact:true}});
let mk=[],meMk=null,ready=false,follow=false,leg=null,legAt=0;
const emptyFC={type:'FeatureCollection',features:[]};
function setLine(id,c){const s=map.getSource(id);if(s)s.setData(c&&c.length>1?{type:'Feature',geometry:{type:'LineString',coordinates:c}}:emptyFC)}
map.on('load',()=>{
  map.getStyle().layers.forEach(l=>{if(l.type==='symbol'&&l.layout&&l.layout['text-field'])map.setLayoutProperty(l.id,'text-field',['coalesce',['get','name:ar'],['get','name']])});
  ['trip','leg'].forEach(id=>map.addSource(id,{type:'geojson',data:emptyFC}));

const brkLeft=()=>work.break_until?Math.max(0,Math.ceil((new Date(work.break_until)-Date.now())/60000)):0;
async function loadWork(){const{data}=await db.from('courier_state').select('*').eq('courier_id',uid).maybeSingle();if(data)work={working:data.working,break_until:data.break_until,phone:data.phone||''};drawShift()}
async function setWork(p){Object.assign(work,p);drawShift();const{error}=await db.from('courier_state').upsert({courier_id:uid,working:work.working,break_until:work.break_until,phone:work.phone,updated_at:new Date().toISOString()});if(error)alert('ماتحفظش حالة الشغل، جرب تاني')}
function pickBreak(){return new Promise(res=>{const d=$('bk');d.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{d.close();res(+b.dataset.m)});$('bkc').onclick=()=>{d.close();res(0)};d.oncancel=()=>res(0);d.showModal()})}
function drawShift(){
  const el=$('shift'),b=brkLeft();
  if(!work.working){
    el.innerHTML='<button id="st">▶ ابدأ العمل</button>';$('st').onclick=async()=>{if(!await ask('بدء العمل','سيبدأ تتبّع موقعك على المسار، ويُسمح بتسجيل التسليم عند الوصول إلى موقع العميل.','ابدأ'))return;setWork({working:true,break_until:null})};
  }else if(b>0){
    el.innerHTML=`<div class="sr"><b>☕ في استراحة</b><span>باقي ${b} دقيقة</span></div>${rcHtml()}<button class="g" id="eb">إنهاء الاستراحة</button>`;
    $('eb').onclick=async()=>{if(await ask('إنهاء الاستراحة','هترجع للشغل ووقت الوصول عند العملاء هيتحدّث.','رجوع للشغل'))setWork({break_until:null})};
  }else{
    el.innerHTML='<div class="sr"><b>🟢 شغال</b><span>الرحلة جارية</span></div>'+rcHtml()+'<div class="row"><button class="g" id="bkb">☕ استراحة</button><button class="g" id="en">⏹ إنهاء العمل</button></div>';
    $('bkb').onclick=async()=>{const m=await pickBreak();if(!m)return;if(await ask('استراحة '+m+' دقيقة','المدة دي هتتضاف على وقت الوصول عند كل العملاء.','ابدأ الاستراحة'))setWork({break_until:new Date(Date.now()+m*60000).toISOString()})};
    $('en').onclick=async()=>{const ms=rc.total-rc.kept,note=ms>0?'\n⚠️ لسه ناقصك '+ms+' فاتورة. لازم ترجعها للشركة.':'\n🧾 معاك '+rc.kept+' فاتورة'+(rc.cash>0?' و'+rc.cash.toLocaleString('en')+' جنيه كاش':'')+'، رجّعهم للشركة.';if(await ask('إنهاء العمل','سيتوقف تتبّع المسار.'+note,'أنهي العمل',true))setWork({working:false,break_until:null})};
  }
  syncTrip();
}
setInterval(()=>{if(work.working)drawShift()},30000);
function ask(t,p,ok,danger,no){return new Promise(res=>{const d=$('cf'),y=$('cfy');$('cft').textContent=t;$('cfp').textContent=p||'';y.textContent=ok||'تأكيد';$('cfn').textContent=no||'إلغاء';y.className=danger?'danger':'';y.onclick=()=>{d.close();res(true)};$('cfn').onclick=()=>{d.close();res(false)};d.oncancel=()=>res(false);d.showModal()})}
let tt=null;
function toast(msg,label,fn){const T=$('toast');T.hidden=false;T.innerHTML='<span></span><button class="ub"></button>';T.firstChild.textContent=msg;const b=T.querySelector('button');b.textContent=label;b.onclick=()=>{T.hidden=true;clearTimeout(tt);fn()};clearTimeout(tt);tt=setTimeout(()=>{T.hidden=true},8000)}
async function undo(id){const{error}=await db.from('stops').update({done:false,done_at:null,receipt_kept:null,cash_collected:null,received:null}).eq('id',id);if(error)return alert('ماقدرتش أتراجع، جرب تاني');load();loadRc()}

$('add').onclick=()=>{$('msg').textContent='';$('dlg').showModal()};
$('cancel').onclick=()=>$('dlg').close();
$('opt').onclick=async()=>{if(await ask('إعادة الترتيب','هيتعمل ترتيب جديد للمسار من مكانك الحالي.','رتّب'))optimize(null)};
let payCash=true;
const setPay=v=>{payCash=v;$('pcash').classList.toggle('on',v);$('ppaid').classList.toggle('on',!v)};
$('pcash').onclick=()=>setPay(true);$('ppaid').onclick=()=>setPay(false);
async function coordsFrom(s){let c=parse(s||'');if(c)return c;const m=(s||'').match(/https?:\/\/\S+/);if(!m)return null;try{const j=await(await fetch('https://br-polished-fire-b7bwdesx-resolve.compute.c-13.us-east-1.aws.neon.tech/?url='+encodeURIComponent(m[0]))).json();return j.lat?j:null}catch(e){return null}}
function parseInvoice(raw){
  const L=raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),T=L.join('\n'),o={};
  let m;
  if((m=T.match(/(?:phone|tel)\s*[:.]?\s*([+\d][\d\s\-]{8,14}\d)/i)))o.phone=m[1].replace(/[\s\-]/g,'');
  else if((m=T.match(/\b(01[0125]\d{8})\b/)))o.phone=m[1];
  if((m=T.match(/invoice\s*#?\s*[:.]?\s*(\d{3,})/i)))o.inv=m[1];
  if((m=T.match(/\b(LS\d{8,})\b/i)))o.trk=m[1].toUpperCase();
  else if((m=T.match(/tracking\s*number\s*[:.]?\s*([A-Z0-9]{8,})/i)))o.trk=m[1];
  if((m=T.match(/\bbu\w*ding\s*[:.]?\s*(\d+\w?)/i)))o.bld=m[1];
  if((m=T.match(/(?:apartment|apart\w*|apt|flat)\.?\s*[:.]?\s*(\w+)/i)))o.apt=m[1];
  const am=[...T.matchAll(/(\d{1,3}(?:,\d{3})*\.\d{2})\s*EGP/gi)].map(x=>parseFloat(x[1].replace(/,/g,'')));
  if(am.length)o.amt=Math.max(...am);
  if((m=T.match(/(\d+)\s*x\s+(.+)/i)))o.ord=m[1]+'x '+m[2].replace(/\s*SKU.*$/i,'').replace(/\s*[\d,]+\.\d{2}\s*EGP\s*$/i,'').trim();
  let i=L.findIndex(l=>/shipping details/i.test(l));
  const junk=/invoice|tracking|^\d{2}\/\d{2}\/\d{2,4}$|^LS\d+|marmelade/i;
  let k=i>=0?i+1:Math.max(0,L.findIndex(l=>/marmelade/i.test(l))+1);
  const seg=[];
  for(;k<L.length;k++){const l=L[k];if(/^phone/i.test(l)||/^egypt$/i.test(l)||/payment details|^image|quantity/i.test(l))break;if(junk.test(l))continue;seg.push(l)}
  if(seg.length>1&&seg[0].toLowerCase()===seg[1].toLowerCase())seg.shift();
  if(seg[0]&&!/\d/.test(seg[0]))o.name=seg[0];
  if(seg.length>1)o.addr=seg.slice(o.name?1:0).join(', ');
  return o;
}


function fillFrom(d){const set=(i,v)=>{if(v!=null&&v!=='')$(i).value=v};set('name',d.name);set('phone',d.phone);set('addr',d.addr);set('bld',d.bld);set('apt',d.apt);set('ord',d.ord);set('inv',d.inv);set('trk',d.trk);set('amt',d.amt)}
function loadTess(){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function prep(f){const im=await createImageBitmap(f),k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.filter='grayscale(1) contrast(1.4)';x.drawImage(im,0,0,c.width,c.height);return c}
$('ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;const o=$('ocr');o.textContent='بقرأ الفاتورة... ممكن ياخد نص دقيقة';
  try{await loadTess();const c=await prep(f);const{data}=await Tesseract.recognize(c,'eng',{logger:m=>{if(m.status==='recognizing text')o.textContent='بقرأ الفاتورة... '+Math.round(m.progress*100)+'%'}});
    fillFrom(parseInvoice(data.text));o.textContent='✅ اتقرت الفاتورة. راجع البيانات قبل الحفظ، خصوصًا التليفون والمبلغ.'}
  catch(err){o.textContent='ماقدرتش أقرأ الفاتورة. اكتب البيانات بإيدك أو صوّر تاني.'}
  e.target.value=''};
const clearForm=()=>{['link','name','phone','ord','addr','bld','apt','inv','trk','amt'].forEach(i=>$(i).value='');setPay(true);$('ocr').textContent='أو اكتب البيانات بإيدك'};
$('save').onclick=async()=>{
  const v=i=>$(i).value.trim();
  if(!v('name')&&!v('phone')){$('msg').textContent='اكتب اسم العميل أو رقمه على الأقل';return}
  let c=null;
  if(v('link')){$('msg').textContent='بدوّر على المكان...';c=await coordsFrom(v('link'));$('msg').textContent='';if(!c){$('msg').textContent='مش قادر أطلّع المكان من اللينك. امسحه أو جرب تاني.';return}}
  const am=parseFloat(v('amt').replace(/,/g,''));
  const{data,error}=await db.from('stops').insert({customer_name:v('name'),phone:v('phone'),order_details:v('ord'),address:v('addr'),building:v('bld'),apartment:v('apt'),invoice_no:v('inv')||null,tracking_no:v('trk')||null,amount:isNaN(am)?null:am,cash:payCash,lat:c?c.lat:null,lng:c?c.lng:null}).select().single();
  if(error){$('msg').textContent='ماتحفظش: '+error.message;return}
  S.push(row(data));clearForm();$('dlg').close();optimize(me);
};
const row=r=>({id:r.id,lat:r.lat,lng:r.lng,name:r.customer_name,phone:r.phone,ord:r.order_details,addr:r.address,bld:r.building,apt:r.apartment,inv:r.invoice_no,trk:r.tracking_no,amt:r.amount==null?null:+r.amount,cash:r.cash,done:false});
async function load(){const{data,error}=await db.from('stops').select('*').eq('done',false);S=error?[]:data.map(row);optimize(null)}
let uid=null,lastPush=0;
let work={working:false,break_until:null,phone:''};
function live(){if(!navigator.geolocation)return;navigator.geolocation.watchPosition(p=>{onFix(p)},()=>{},{enableHighAccuracy:true})}
setInterval(async()=>{if(!uid)return;const{data}=await db.from('stops').select('*').eq('done',false);if(!data)return;const n=x=>x.filter(s=>s.lat!=null).length;if(n(data)!==n(S)||data.length!==S.length){S=data.map(row);optimize(me)}},20000);
async function boot(){const{data}=await db.auth.getSession();if(data&&data.session){uid=(data.user||data.session.user||{}).id;$('auth').style.display='none';load();live();loadWork();loadRc()}else $('auth').style.display='flex'}
async function enter(fn){$('amsg').textContent='';const r=await fn();if(r.error){$('amsg').textContent=r.error.message||'فشل';return}boot()}

$('nav').onclick=()=>{follow=!follow;$('nav').textContent=follow?'🗺️':'🧭';$('nav').classList.toggle('on',follow);if(follow)cam(800);else{map.easeTo({pitch:0,bearing:0,padding:{top:0,bottom:0,left:0,right:0}});render(true)}};
$('loc').onclick=()=>{if(!me)return alert('لسه مستني إشارة الـ GPS، اتأكد إن الموقع شغال');map.easeTo({center:[me.lng,me.lat],zoom:Math.max(map.getZoom(),16),duration:700})};
map.on('dragstart',e=>{if(e.originalEvent&&follow){follow=false;$('nav').textContent='🧭';$('nav').classList.remove('on');map.easeTo({pitch:0,padding:{top:0,bottom:0,left:0,right:0},duration:400})}});
$('panel').addEventListener('click',e=>{if(e.target===$('panel')&&e.clientY-$('panel').getBoundingClientRect().top<30)$('panel').classList.toggle('min')});
$('out').onclick=async()=>{if(!await ask('تسجيل الخروج','هتحتاج تدخل بالإيميل وكلمة السر تاني.','اخرج',true))return;await db.auth.signOut();location.reload()};
boot();
