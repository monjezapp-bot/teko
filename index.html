<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00A8E1">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Teko</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Amiri:wght@700&display=swap">
<style>
:root{--bg:#F3F9FD;--card:#fff;--tx:#1F2733;--sc:#667085;--bd:#E4E7EC;--sf:#F4F5F7;--y:#00A8E1;--ony:#062A40;--dk:#1C243B;--bl:#3E8FD6;--blb:#E3F0FB;--ok:#1E7A4A;--okb:#E3F4EA;--er:#D92D3A;--wn:#FFF1CC;--wnt:#8A5A00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151C;--card:#1A1F29;--tx:#EEF0F3;--sc:#98A2B3;--bd:#2A303A;--sf:#1F242D;--dk:#2C3446;--bl:#6DB3F2;--blb:#1B2B3D;--ok:#5CD38F;--okb:#153524;--er:#F97066;--wn:#3A2F12;--wnt:#F6BC2F}}
:root[data-theme="dark"]{--bg:#12151C;--card:#1A1F29;--tx:#EEF0F3;--sc:#98A2B3;--bd:#2A303A;--sf:#1F242D;--dk:#2C3446;--bl:#6DB3F2;--blb:#1B2B3D;--ok:#5CD38F;--okb:#153524;--er:#F97066;--wn:#3A2F12;--wnt:#F6BC2F}
*{box-sizing:border-box;margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;font-family:'IBM Plex Sans Arabic',Tajawal,Cairo,system-ui,sans-serif;background:var(--sf);color:var(--tx);display:flex;flex-direction:column}
button,input,a{font:inherit;color:inherit}a{text-decoration:none}
.scr{flex:1;overflow:auto;padding:20px 18px 24px}
h1{font-size:24px;font-weight:600}.t2{font-size:16px;font-weight:600}.sc{color:var(--sc)}.sm{font-size:13px}.b{font-weight:500}
.btn{width:100%;height:58px;background:var(--y);color:var(--ony);border:0;border-radius:14px;font-weight:600;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{background:var(--sf);color:var(--sc);cursor:default}
.b2{height:48px;padding:0 16px;background:var(--card);border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;flex:1;font-weight:500}
.b2:disabled,.b2.off{opacity:.4;pointer-events:none}
.sq{width:56px;height:56px;border-radius:16px;background:var(--y);color:var(--ony);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-top:12px}
.card.cur{border:2px solid var(--y)}
.hero{background:var(--dk);color:#fff;border-radius:20px;padding:24px;text-align:center;margin-top:16px}.hero .sc{color:#C3CAD6}
.huge{font-size:72px;font-weight:600;line-height:1.1;margin:4px 0}
.r{display:flex;align-items:center;gap:12px}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--okb);color:var(--ok)}
.al{border-radius:14px;padding:14px 16px;margin-top:12px;background:var(--wn);color:var(--wnt);font-weight:500}.al.ok{background:var(--okb);color:var(--ok)}.al.er{background:#FDECEA;color:var(--er)}
.f{display:block;margin-top:16px}.f span{display:block;font-size:13px;color:var(--sc);margin-bottom:6px}
.in{width:100%;height:52px;border:1.5px solid var(--bd);background:var(--card);border-radius:12px;padding:0 14px;font-size:16px}.in:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.pm{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;margin-top:8px;border:1.5px solid var(--bd);background:var(--card);border-radius:12px;cursor:pointer;text-align:start}
.pm.on{border-color:var(--ok)}
.rk{width:36px;height:36px;border-radius:10px;background:var(--sf);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}.rk.on{background:var(--y);color:var(--ony)}
.ac{display:flex;gap:8px;margin-top:12px}.ac .btn{height:48px;font-size:16px;flex:1.4;border-radius:12px}
.ad{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--blb);color:var(--bl);font-size:14px;cursor:pointer}
.ad .tg{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--bl);color:#fff}
.lv:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-inline-end:6px;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.3}}
.md{position:absolute;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:5}.md>div{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:28px 20px 24px;text-align:center}
.toast{position:absolute;inset-inline:16px;bottom:16px;background:var(--dk);color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.toast button{background:none;border:0;color:var(--y);font-weight:600;padding:8px;cursor:pointer}
.row3{display:flex;align-items:center;gap:12px;padding:12px 0}.row3+.row3{border-top:1px solid var(--bd)}

body{height:100%}#dv{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;padding:8px;background:var(--dk);color:#fff;font-size:12px}
#dv button{height:32px;padding:0 12px;border-radius:999px;border:1px solid #ffffff44;background:none;color:#fff;cursor:pointer}
.app{position:relative;flex:1;min-height:0;width:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}.app.wide{max-width:860px}
@media(min-width:600px){.app{border-inline:1px solid var(--bd)}}
.lb{display:flex;align-items:center;justify-content:center;width:190px;height:92px;margin:0 auto 22px;border-radius:26px;background:var(--dk);color:#fff;font-weight:700;font-size:30px}.lb img{width:130px;height:auto;display:block}
.rg{display:flex;flex-direction:column;padding-top:36px}
.lg{text-align:center;margin-bottom:30px}.lg img,.lg .sq{width:88px;height:88px;object-fit:contain;display:flex;margin:0 auto 20px;border-radius:24px}.lg .sq{font-size:42px}
.lg h1{font-size:28px;line-height:1.3}.sub{color:var(--sc);font-size:15px;line-height:1.7;margin-top:8px}
.f span{font-size:14px;font-weight:500;color:var(--tx);margin-bottom:8px}.f small{display:block;font-size:12px;color:var(--sc);margin-top:6px}
.in{height:54px}.in[dir=ltr]{text-align:right}
.sec{font-size:13px;font-weight:600;color:var(--sc);margin:30px 0 2px}
.pm{padding:14px}.pi{width:44px;height:44px;border-radius:12px;background:var(--sf);display:flex;align-items:center;justify-content:center;flex:none;color:var(--sc)}.pm.on .pi{background:var(--okb);color:var(--ok)}
.rg .btn{margin-top:30px}.fn{text-align:center;font-size:12px;color:var(--sc);margin-top:14px;line-height:1.7}
.off{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;background:var(--er);color:#fff;text-align:center;padding:10px 12px;font-size:14px;font-weight:600}
.adi{display:block;margin:12px 0;border-radius:14px;overflow:hidden;border:1px solid var(--bd);background:var(--card)}.adi img{width:100%;height:auto;display:block;-webkit-user-drag:none}
.cl{position:fixed;inset:0;z-index:60;background:rgba(6,24,40,.62);display:flex;align-items:center;justify-content:center;padding:24px}
.cl .cd{width:100%;max-width:380px;background:var(--card);border-radius:24px;padding:26px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.cl .ib{width:72px;height:72px;border-radius:50%;background:var(--y);color:var(--ony);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;animation:cp .7s ease-in-out 5}
.cl h2{font-size:24px;line-height:1.6;margin:6px 0 22px}
@keyframes cp{50%{transform:scale(1.15)}}

/* ===== reels ===== */
.ov{position:fixed;top:0;left:0;right:0;bottom:var(--tbh);z-index:40;display:none;max-width:480px;margin:0 auto;background:#000;color:#fff;overflow:hidden}
#rl .rf{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#rl .rf::-webkit-scrollbar{display:none}
#rl .rv{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#0b0f16 center/cover no-repeat;overflow:hidden}
#rl .rv:before{content:'';position:absolute;inset:0;background:rgba(0,0,0,.35)}
#rl .rp{position:absolute;inset:0;z-index:1}
#rl .rp iframe{width:100%;height:100%;border:0;display:block;background:#000;pointer-events:none}
#rl .rtap{position:absolute;inset:0;z-index:2}
#rl .rpl{position:absolute;inset:0;z-index:3;display:none;align-items:center;justify-content:center;font-size:64px;text-shadow:0 2px 12px #0008;pointer-events:none}
#rl .rv[data-p="1"] .rpl{display:flex}
#rl .rm{position:absolute;inset-inline:0;bottom:0;z-index:3;padding:60px 16px 22px;background:linear-gradient(transparent,rgba(0,0,0,.7));pointer-events:none}
#rl .rtt{font-weight:600;font-size:16px;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#rl .rch{font-size:13px;opacity:.85;margin-top:4px}
.ov .rt{position:absolute;top:0;inset-inline:0;z-index:6;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 28px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
.ov .rx{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ov .rs{flex:1;text-align:center;font-size:14px;font-weight:600;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.45)}
.ov .rs.hot{background:#F6BC2F;color:#1C243B}
.ov .rbn{position:absolute;inset:0;z-index:7;background:rgba(6,24,40,.8);align-items:center;justify-content:center;padding:24px}
.ov .rcd{width:100%;max-width:380px;background:var(--card);color:var(--tx);border-radius:24px;padding:26px 22px;text-align:center}
.ov .rcd h2{font-size:24px;line-height:1.6;margin:6px 0 4px}
.ov .rib{width:72px;height:72px;border-radius:50%;background:var(--y);color:var(--ony);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
#rl .rem{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;line-height:1.8}

:root{--tbh:calc(70px + env(safe-area-inset-bottom,0px))}
#tb{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:45;display:none;gap:4px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding:6px 8px calc(env(safe-area-inset-bottom,0px) + 6px);box-shadow:0 -4px 18px rgba(16,24,40,.07)}
.tbb{flex:1;border:0;background:none;color:var(--sc);display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:14px;font:inherit;font-size:12px;font-weight:500;cursor:pointer;position:relative;transition:color .15s}
.tbb svg{width:25px;height:25px}
.tbb.on{color:var(--y)}
.tbb.on span{font-weight:700}
.tbb.on:before{content:'';position:absolute;top:-7px;width:30px;height:3px;border-radius:0 0 4px 4px;background:var(--y)}
.tbb.dis{opacity:.35;pointer-events:none}
body.tbon .scr{padding-bottom:92px}
body:has(.md) #tb{display:none!important}

/* ===== domino ===== */
#dm{background:radial-gradient(ellipse at 50% 25%,#15664d 0%,#0c3f31 55%,#07261d 100%)}
#dm .dcol{position:absolute;inset:0;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 62px) 10px 8px}
#dm .dsb{display:flex;gap:8px}
#dm .dsc2{flex:1;background:rgba(0,0,0,.30);border:1.5px solid rgba(255,255,255,.12);border-radius:14px;padding:7px 11px;transition:border-color .2s,box-shadow .2s}
#dm .dsc2.act{border-color:#F6BC2F;box-shadow:0 0 0 1px #F6BC2F,0 0 16px rgba(246,188,47,.35)}
#dm .dsc2 .dr{display:flex;align-items:baseline;justify-content:space-between}
#dm .dsc2 .n{font-size:12px;opacity:.85}
#dm .dsc2 .v{font-size:22px;font-weight:700;line-height:1.2}
#dm .dsc2 .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:3px}
#dm .dsc2 .bar i{display:block;height:100%;background:#F6BC2F;transition:width .5s}
#dm .dopp{display:flex;align-items:center;min-height:42px;margin-top:6px;font-size:12px;gap:2px}
#dm .dopp .dlb{margin-inline-end:10px;opacity:.9;white-space:nowrap}
#dm .dk{flex:none;width:19px;height:32px;margin-inline-end:-7px;border-radius:5px;border:1px solid #D9CFAE;background:radial-gradient(circle at 50% 50%,#E9D58A 0 2px,transparent 3px),linear-gradient(145deg,#2F7D66,#14513F);box-shadow:0 2px 4px rgba(0,0,0,.4)}
#dm .dbd{--s:30px;flex:1;min-height:0;overflow:auto;direction:ltr;padding:12px 10px;margin:6px 0;border-radius:20px;border:5px solid #6B4423;background:radial-gradient(ellipse at center,#1F7D5C 0%,#136247 60%,#0E4B37 100%);box-shadow:inset 0 0 34px rgba(0,0,0,.6),0 0 0 1px #2A170A,0 8px 18px rgba(0,0,0,.45);scrollbar-width:none}
#dm .dbd::-webkit-scrollbar{display:none}
#dm .dem{height:100%;display:flex;align-items:center;justify-content:center;opacity:.65;font-size:15px;text-align:center;direction:rtl}
#dm .drow{display:flex;align-items:center;gap:3px;margin-bottom:5px}
#dm .drow.rv{flex-direction:row-reverse}
#dm .dt{position:relative;display:flex;flex:none;border-radius:calc(var(--s)*.22);border:1px solid #B9AE8E;background:linear-gradient(145deg,#FFFDF7,#EDE5D0);box-shadow:0 2px 0 #CFC5A6,0 4px 8px rgba(0,0,0,.38);color:#1C243B}
#dm .dt.v{flex-direction:column}
#dm .dt:after{content:'';position:absolute;left:50%;top:50%;width:calc(var(--s)*.15);height:calc(var(--s)*.15);border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#F0D88A,#8A6D1F);z-index:2}
#dm .hf{width:var(--s);height:var(--s);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--s)*.14)}
#dm .hf i{display:block}
#dm .hf .pp{margin:13%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4B5066,#12151F);box-shadow:inset 0 -1px 1px rgba(255,255,255,.18)}
#dm .dt:not(.v) .hf+.hf{border-left:1.5px solid #B9AE8E}
#dm .dt.v .hf+.hf{border-top:1.5px solid #B9AE8E}
#dm .dt.tg{cursor:pointer;animation:dpulse 1s ease-in-out infinite}
#dm .dt.dpop{animation:dpop .42s cubic-bezier(.2,.9,.3,1.2) both;z-index:3}
#dm .dt.dpop.ft{--fy:-90px}#dm .dt.dpop.fb{--fy:110px}
#dm .dinf{display:flex;align-items:center;gap:10px;margin-top:2px}
#dm .dends{flex:1;display:flex;align-items:center;gap:6px;font-size:12px}
#dm .dend{min-width:28px;height:28px;padding:0 4px;border-radius:8px;background:#F8F5EC;color:#1C243B;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #CFC5A6}
#dm .dstk{border:0;background:none;display:flex;align-items:center;gap:9px;color:#fff;font:inherit;font-size:12px;cursor:pointer;padding:2px 4px}
#dm .dstk .pile{width:30px;height:42px;border-radius:6px;border:1px solid #D9CFAE;background:radial-gradient(circle at 50% 50%,#E9D58A 0 2px,transparent 3px),linear-gradient(145deg,#2F7D66,#14513F);box-shadow:2px 2px 0 #0B3B2E,4px 4px 0 #0B3B2E}
#dm .dstk.need .pile{animation:dpulse 1s ease-in-out infinite}
#dm .dmsg{text-align:center;font-size:15px;font-weight:500;min-height:24px;line-height:1.6;margin-top:6px}
#dm .dnote{text-align:center;font-size:12px;opacity:.8;min-height:18px}
#dm .dots i{display:inline-block;width:5px;height:5px;margin:0 2px;border-radius:50%;background:#fff;animation:ddot 1s infinite}
#dm .dots i:nth-child(2){animation-delay:.15s}#dm .dots i:nth-child(3){animation-delay:.3s}
#dm .dctl{display:flex;gap:8px;margin-top:4px}
#dm .dctl:empty{display:none}
#dm .dctl .btn{height:46px;font-size:15px;flex:1;margin:0}
#dm .dctl .btn.g{background:rgba(255,255,255,.16);color:#fff}
#dm .dhand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;--s:38px;padding:8px 0 4px}
#dm .dh{background:none;border:0;padding:0;opacity:.5;transition:transform .15s,opacity .15s;cursor:pointer}
#dm .dh.ok{opacity:1}
#dm .dh.ok .dt{box-shadow:0 0 0 2px #F6BC2F,0 0 16px rgba(246,188,47,.5),0 4px 8px rgba(0,0,0,.38)}
#dm .dh.sel{transform:translateY(-12px)}
#dm .dh:active{transform:scale(.95)}
#dm .dh.ddeal{animation:ddeal .4s ease-out both}
#dm .dh.dnew{animation:ddeal .45s ease-out both}
#dm .cf{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:dcf 2.4s ease-in forwards;pointer-events:none}
@keyframes dpop{0%{transform:translateY(var(--fy,0)) scale(1.45) rotate(-6deg);opacity:0;box-shadow:0 18px 22px rgba(0,0,0,.5)}60%{opacity:1}100%{transform:none}}
@keyframes ddeal{0%{transform:translateY(46px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
@keyframes dpulse{0%,100%{box-shadow:0 0 0 2px #F6BC2F,0 0 4px rgba(246,188,47,.4)}50%{box-shadow:0 0 0 3px #F6BC2F,0 0 18px rgba(246,188,47,.9)}}
@keyframes ddot{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
@keyframes dcf{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(560px) rotate(540deg);opacity:.9}}

/* ===== سحب الأحجار + طيار ضد طيار ===== */
#dm .dh{touch-action:none}
#dm .dh.drg{opacity:.22}
#dm .dgh{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-115%) scale(1.25) rotate(-5deg);filter:drop-shadow(0 14px 12px rgba(0,0,0,.5))}
#dm .dbd.dz{border-color:#F6BC2F}
#dm .dbd.dzh{box-shadow:inset 0 0 34px rgba(246,188,47,.3),0 0 0 3px #F6BC2F,0 0 30px rgba(246,188,47,.75)}
#dm .dt.dtg{box-shadow:0 0 0 3px #F6BC2F,0 0 14px rgba(246,188,47,.8);animation:dpulse 1s ease-in-out infinite}
#dm .dt.dtgh{box-shadow:0 0 0 4px #fff,0 0 22px #F6BC2F}

/* ===== ترابيزة أكبر: ضغط الهيدر واليد ===== */
#dm .dopp{min-height:26px;margin-top:4px}
#dm .dk{width:14px;height:22px;margin-inline-end:-5px;border-radius:4px}
#dm .dstk .pile{width:24px;height:34px}
#dm .dmsg{min-height:40px;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:14px}
#dm .dmsg .dctl .btn{height:38px;font-size:14px;border-radius:12px}
#dm .dnote{min-height:0}#dm .dnote:empty{display:none}
#dm .dhand{flex-wrap:nowrap;gap:0;justify-content:center;padding:4px 0 2px;min-height:calc(var(--s)*2 + 12px)}
#dm .dh{flex:none}
#dm .dh+.dh{margin-inline-start:var(--ov,6px)}
#dm .dh.ok{position:relative;z-index:1}
#dm .dbd{margin:4px 0}
</style></head><body>
<div id="app" class="app"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const DEV=false,SB_URL=TEKO_CFG.url,SB_KEY=TEKO_CFG.key;
