<script>
const DEV=false,SB_URL=TEKO_CFG.url,SB_KEY=TEKO_CFG.key;
const N=n=>n.toLocaleString('en-US'),E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),A2=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));

const P={pin:'<path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',dl:'<path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/>',chev:'<path d="M15 18l-6-6 6-6"/>',check:'<path d="M20 6L9 17l-5-5"/>'};

const ad=()=>{const a=AD_();if(!(a&&Date.now()<a.end))return'';const u=safeUrl(a.url);if(a.image){const im=`<img src="${E(safeUrl(a.image))}" alt="" draggable="false" onerror="this.closest('.adi').remove()">`;return u=='#'?`<div class="adi">${im}</div>`:`<a class="adi" href="${E(u)}" target="_blank" rel="noopener noreferrer">${im}</a>`}const tx=a.tag==null?'إعلان':a.tag,tg=`${tx?`<span class="tg">${E(tx)}</span>`:''}<span style="flex:1;line-height:1.7">${E(a.text)}</span>`;return u=='#'?`<div class="ad" style="cursor:default">${tg}</div>`:`<a class="ad" href="${E(u)}" target="_blank" rel="noopener noreferrer">${tg}${ic('chev',18)}</a>`};
let AC=null;const ua=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume()}catch(e){}};['touchstart','click','keydown'].forEach(e=>addEventListener(e,ua,{passive:true}));

const notify=async(t,b)=>{try{if(!window.Notification||Notification.permission!='granted')return;const o={body:b,tag:'teko',renotify:true,vibrate:[200,100,200],icon:'icon-192.png'};const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(r)await r.showNotification(t,o);else new Notification(t,o)}catch(e){}};
const dist=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 12742e3*Math.asin(Math.sqrt(h))};
let GPS=0,LOC=null,LSIG='';
const chk=()=>{const c=CF();const i=!!(LOC&&c&&dist(LOC.lat,LOC.lng,c.lat,c.lng)<=c.r);if(i!=GPS){GPS=i;return 1}return 0};
const wg=()=>{try{navigator.geolocation.watchPosition(p=>{LOC={lat:p.coords.latitude,lng:p.coords.longitude};if(chk()){render();ST(1)}if(window.onLoc)onLoc()},()=>{},{enableHighAccuracy:true})}catch(e){}};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'#';
setInterval(()=>{const a=AD_();if(a&&Date.now()>a.end&&document.querySelector('.ad'))render()},1000);
document.addEventListener('contextmenu',e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()});
let M=ld('teko-me',{me:null,perm:{l:0,n:0,i:0},note:'',moved:0,al:0,fn:'',fp:'',gc:0,in:0,lp:0,deny:'',tok:'',err:''});
const sm=()=>sv('teko-me',M),pos=()=>S.pos||0,inside=()=>DEV?!!M.gc:GPS;
let DI=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();DI=e});
if(M.perm.l)wg();

const DN={x:'تعذر التسجيل — تأكد من الاتصال وحاول مرة أخرى',l:'الموقع مرفوض — فعّله من إعدادات الموبايل ثم ارجع للتطبيق',n:'الإشعارات مرفوضة — فعّلها من إعدادات الموبايل ثم ارجع للتطبيق',i:'افتح الرابط من متصفح Chrome (مش من واتساب)، ثم اضغط ⋮ واختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية»',i2:'افتح الرابط من Safari، اضغط زر المشاركة ثم «Add to Home Screen»',l2:'تعذر تحديد موقعك — شغّل الـ GPS وجرّب تاني',n2:'الإشعارات مش متاحة في المتصفح ده — ثبّت التطبيق على الشاشة الرئيسية وافتحه منها'};
const reg=()=>`<div class="scr rg"><div class="lg"><span class="lb"><img src="logo.png" alt="Teko" onerror="this.replaceWith('Teko')"></span><h1>أهلاً بيك في Teko</h1><p class="sub">سجّل بياناتك مرة واحدة وابدأ حجز دورك</p></div>

const home=()=>`<div class="scr">${hd()}${M.note?`<div class="al ok r" style="justify-content:space-between"><span>${E(M.note)}</span><button onclick="M.note='';sm();render()" style="background:none;border:0;cursor:pointer;font-size:18px" aria-label="إخفاء">✕</button></div>`:''}
${M.err?`<div class="al er">${E(M.err)}</div>`:''}<div class="card r" style="border-color:${inside()?'var(--ok)':'var(--y)'}"><span style="color:${inside()?'var(--ok)':'var(--wnt)'}">${ic('pin',28)}</span><div><div class="b">${inside()?'أنت داخل موقع الاستلام':'أنت خارج موقع الاستلام'}</div><div class="sc sm">${inside()?'تقدر تحجز دورك دلوقتي':'اقترب من الموقع عشان يشتغل الحجز'}</div></div></div>
<div class="sc sm" style="text-align:center;margin:28px 0 12px">${N(S.tot)} طيار في الانتظار دلوقتي</div><button class="btn" style="height:72px;font-size:22px" ${inside()?'':'disabled'} onclick="book()">احجز الآن</button>${honor()}${batCard()}${ad()}</div>`;
const queue=()=>{const p=pos(),n=S.tot,pv=S.pv?{name:S.pv}:null,nx=S.nx?{name:S.nx}:null,mv=M.moved&&M.moved==p;if(p<=3&&M.al!=p){M.al=p;sm();setTimeout(()=>{beep();notify('استعد للاستلام',p==1?'دورك الآن':'قبلك '+(p-1))},60)}
const ln=(l,x,k,me)=>`<div class="row3"><span class="rk ${me?'on':''}">${k?N(k):'—'}</span><div style="flex:1"><div class="sc sm">${l}</div><div class="${me?'b':''}">${x?E(x.name):'—'}</div></div>${me?'<span class="pill">أنت</span>':''}</div>`;
return`<div class="scr">${hd()}${p==1?'<div class="al ok">دورك الآن — توجّه للمشرف واستلم أوردرك</div>':p<=3?`<div class="al">استعد للاستلام — قبلك ${N(p-1)} ${p==2?'طيار':'طيارين'}</div>`:''}${mv?`<div class="al er">المشرف رحّل دورك إلى رقم ${N(p)}</div>`:''}
<div class="hero"><div class="sc">دورك رقم</div><div class="huge">${N(p)}</div><div class="sc">من ${N(n)} في الانتظار</div></div>
<div class="card" style="padding:4px 16px">${ln('قبلك',pv,p-1,0)}${ln('أنت',M.me,p,1)}${ln('بعدك',nx,nx?p+1:0,0)}</div>${honor()}${batCard()}${ad()}</div>${M.mod?`<div class="md"><div><div class="sq" style="margin:0 auto 12px;background:var(--okb);color:var(--ok)">${ic('check',32)}</div><h1>تم حجز دورك</h1><div class="sc" style="margin:6px 0 20px">رقمك ${N(p)} في الانتظار</div><button class="btn" onclick="M.mod=0;sm();render()">موافق</button></div></div>`:''}`};
const sync=()=>{const p=pos();if(p)M.call=null;if(M.in&&!p){M.note='تم تسجيل استلامك '+now();M.al=0;M.moved=0;loadHonor()}else if(p&&M.lp&&p>M.lp)M.moved=p;M.in=p?1:0;M.lp=p;sm();render()};
const book=async()=>{if(!inside()||pos()||!LOC)return;try{const{data,error}=await sb.rpc('book',{p_token:M.tok,p_lat:LOC.lat,p_lng:LOC.lng});if(error||!data||data.err)throw data&&data.err||1;S=data;M.mod=1;M.note='';M.err='';M.moved=0;sync()}catch(e){M.err=e=='outside'?'أنت خارج موقع الاستلام':'تعذر الحجز، حاول مرة أخرى';sm();render()}};
const ST=async f=>{if(!M.tok){LASTOK=Date.now();return}try{const{data,error}=await sb.rpc('get_state',{p_token:M.tok});if(error||!data)return;LASTOK=Date.now();if(OFF){OFF=false;render()}if(data.err){M.me=null;M.tok='';M.in=0;M.lp=0;sm();render();return}const g=JSON.stringify(data);if(g==LSIG&&!f)return;LSIG=g;S=data;chk();const bc=data.bc;if(bc&&M.me&&bc.id!==M.bc){if(data.pos>0)M.bc=bc.id;else if(inside()){M.bc=bc.id;M.call=bc.text;beep();notify('نداء من المشرف',bc.text)}}sync()}catch(e){}};
let LASTOK=Date.now(),OFF=false;setInterval(()=>{const o=Date.now()-LASTOK>12000;if(o!=OFF){OFF=o;render()}},3000);
const brand=()=>{const u=navigator.userAgent;if(/iPhone|iPad|iPod/.test(u))return'ios';if(/SM-|Samsung/i.test(u))return'sam';if(/Xiaomi|Redmi|POCO|MIUI|HyperOS/i.test(u))return'mi';if(/CPH|RMX|OPPO|Realme|OnePlus|PJ[A-Z]\d/i.test(u))return'op';if(/HUAWEI|HONOR|HMA-|ELS-|JSN-/i.test(u))return'hw';if(/Infinix|TECNO|itel/i.test(u))return'tc';return'and'};
const BST={ios:'ثبّت التطبيق على الشاشة الرئيسية (Share ← Add to Home Screen) وافتحه من الأيقونة، وخلّي الإشعارات «سماح» من إعدادات الآيفون.',sam:'الإعدادات ← البطارية ← حدود استخدام الخلفية: شيل Chrome والتطبيق من «التطبيقات النائمة»، وفي إعدادات التطبيق ← البطارية اختار «غير مقيّد».',mi:'الإعدادات ← التطبيقات ← إدارة التطبيقات ← Chrome (أو Teko) ← توفير البطارية ← «بدون قيود»، وفعّل «التشغيل التلقائي».',op:'الإعدادات ← البطارية ← استخدام البطارية للتطبيق ← Chrome ← اسمح بالنشاط في الخلفية، وفعّل «التشغيل التلقائي».',hw:'الإعدادات ← البطارية ← إطلاق التطبيق ← Chrome ← إدارة يدوية ← فعّل التشغيل التلقائي والتشغيل في الخلفية.',tc:'الإعدادات ← إدارة البطارية أو الطاقة ← Chrome ← «بدون قيود»، وفعّل التشغيل التلقائي من مدير التطبيقات.',and:'الإعدادات ← التطبيقات ← Chrome (أو Teko) ← البطارية ← «غير مقيّد» أو «بدون قيود».'};
const batCard=()=>{if(M.bat||!M.tok||!window.Notification||Notification.permission!='granted')return'';const st=M.bs||'',w=st=='wait';
const msg=w?'هيجيلك إشعار تجريبي خلال 10 ثواني. <b>اقفل الشاشة أو اطلع للشاشة الرئيسية</b> دلوقتي وارجع بعد نص دقيقة.':st=='vis'?'الإشعار وصل والتطبيق كان مفتوح، ده مش كفاية. جرّب تاني واقفل الشاشة أو اطلع للشاشة الرئيسية قبل ما يوصل.':st=='fail'?'الإشعار ما وصلش والتطبيق مقفول. غالباً توفير البطارية بيوقفه. اعمل الخطوات دي وجرّب تاني:':'موبايلات كتير بتوقف التطبيقات في الخلفية لتوفير البطارية فالإشعار ممكن ما يوصلش وقت دورك. اختبر إشعارك دلوقتي.';
return`<div class="card" style="margin-top:12px;padding:16px;border:1.5px solid var(--y)"><div class="b" style="margin-bottom:6px">اتأكد إن الإشعارات هتوصلك</div><div class="sc sm" style="line-height:1.8">${msg}</div>${st=='fail'?`<div class="sm" style="margin-top:10px;line-height:1.8;background:var(--sf);border-radius:12px;padding:12px">${BST[brand()]}<div class="sc" style="margin-top:6px">المسارات بتختلف حسب الموبايل والإصدار.</div></div>`:''}${w?'':`<button class="btn" style="margin-top:12px;height:52px" onclick="batTest()">${st?'جرّب تاني':'اختبر الإشعارات'}</button>`}</div>`};
const batTest=async()=>{M.bs='wait';M.bn='';sm();render();try{const{data,error}=await sb.rpc('test_push',{p_token:M.tok});if(error||!data)throw 0;M.bn=data;M.ba=Date.now();sm();setTimeout(batCheck,15000)}catch(e){M.bs='fail';sm();render()}};
const batCheck=async()=>{if(M.bs!='wait'||!M.bn||document.hidden)return;const el=Date.now()-M.ba;if(el<14000){setTimeout(batCheck,14500-el);return}try{const{data}=await sb.rpc('test_status',{p_token:M.tok,p_nonce:M.bn});if(data&&data.acked){if(data.vis)M.bs='vis';else{M.bat=1;M.bs='';M.note='تمام — الإشعارات شغالة والتطبيق مقفول ✔'}}else if(el>45000)M.bs='fail';else{setTimeout(batCheck,5000);return}}catch(e){M.bs='fail'}sm();render()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)batCheck()});
let H=null,HT='m',HS='';
const loadHonor=async()=>{if(!M.tok)return;try{const{data,error}=await sb.rpc('get_honor',{p_token:M.tok});if(error||!data||data.err)return;const g=JSON.stringify(data);if(g==HS)return;HS=g;H=data;render()}catch(e){}};
const htab=t=>{HT=t;render()};
const honor=()=>{if(!H||!M.tok)return'';const L=(HT=='d'?H.day:H.month)||[],me=H.me||{},per=HT=='d'?'اليوم':'الشهر',mn=HT=='d'?me.d:me.m;
const rows=L.length?L.map(x=>`<div class="hr ${x.me?'me':''}"><span class="md g${Math.min(x.r,3)}">${N(x.r)}</span><span class="nm">${E(x.name)}</span><span class="ct"><b>${N(x.n)}</b>استلام ناجح</span></div>`).join(''):`<div class="em">لسه مفيش أبطال ${per==='اليوم'?'النهارده':'الشهر ده'} — كن أول المتصدرين</div>`;
const mine=mn>0?`<div class="mn">رصيدك ${per==='اليوم'?'النهارده':'هذا الشهر'}: ${N(mn)} استلام ناجح${HT=='m'&&me.rm?` · ترتيبك ${N(me.rm)}`:''}</div>`:'';
return`<div class="cert"><div class="in"><div class="tt">شهادة تقدير</div><div class="ln">✦</div><div class="sb">تقديراً للالتزام بالدور والانضباط في الاستلام</div><div class="tabs"><button class="${HT=='m'?'on':''}" onclick="htab('m')">الشهر</button><button class="${HT=='d'?'on':''}" onclick="htab('d')">اليوم</button></div>${rows}${mine}<div class="ft">شكراً لكل طيار ملتزم</div></div></div>`};
setInterval(()=>{if(!document.hidden)loadHonor()},120000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadHonor()});
const callGo=()=>{M.call=null;sm();book()},callX=()=>{M.call=null;sm();render()};
const callM=()=>M.call?`<div class="cl"><div class="cd"><div class="ib">${ic('bell',34)}</div><div class="sc sm">نداء من المشرف</div><h2>${E(M.call)}</h2>${pos()?'':'<button class="btn" onclick="callGo()">احجز الآن</button>'}<button class="btn" style="background:var(--sf);color:var(--tx);margin-top:10px" onclick="callX()">إغلاق</button></div></div>`:'';
function render(){document.getElementById('app').innerHTML=(OFF&&M.me?'<div class="off">الاتصال ضعيف — البيانات اللي قدامك ممكن تكون قديمة</div>':'')+(!M.me?reg():pos()?queue():home())+callM()}
const VAPID='BOEWFSkEt7LTXatldWh9uXocWcSW43YK79QJX5v_6vR2M7lqZvbPI4_A0fFsxl3DRlbsZtTWBcb2LrQ7Dpqsdg4';
const b64=s=>{const r=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),a=atob(r),u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return u};
const pushSub=async()=>{try{if(!M.tok||!('serviceWorker' in navigator)||!('PushManager' in window)||!window.Notification||Notification.permission!='granted')return;const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(VAPID)});const j=sub.toJSON(),sig=j.endpoint+M.tok+new Date().toISOString().slice(0,10);if(M.ps===sig)return;const{error}=await sb.rpc('save_push',{p_token:M.tok,p_key:null,p_sub:j});if(!error){M.ps=sig;sm()}}catch(e){}};
let LT=0;window.onLoc=()=>{const n=Date.now();if(!M.tok||!LOC||n-LT<30000)return;LT=n;sb.rpc('touch',{p_token:M.tok,p_lat:LOC.lat,p_lng:LOC.lng}).then(()=>{},()=>{})};
setInterval(()=>{if(!document.hidden)onLoc()},45000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pushSub()});
sb.channel('teko').on('broadcast',{event:'q'},()=>ST()).subscribe();setInterval(()=>ST(),5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)ST()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();ST();pushSub();loadHonor();
</script></body></html>
